name: FoodNote CI
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install & lint
        run: npm ci && npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install & test
        run: npm ci && npm run test

  backend-integration:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodnote
          POSTGRES_PASSWORD: foodnote
          POSTGRES_DB: foodnote_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodnote -d foodnote_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # NODE_ENV is deliberately unset: app.module.ts runs migrations on boot
    # unless it is production, and that is what creates the schema here.
    env:
      DATABASE_URL: postgresql://foodnote:foodnote@localhost:5432/foodnote_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      # No OPENAI_API_KEY: createTestApp always overrides the MealParser port,
      # so the provider factory that reads the key never runs. Runs on every
      # push, unlike the smoke net below — it takes seconds, and it is the suite
      # most likely to catch a backend regression early.
      - name: Install & run the Nest integration suite
        run: npm ci && npm run build -w shared && npm run test:e2e -w backend

  e2e:
    # Pull requests only: the triggers above also fire on every push to every
    # branch, and a full-stack run per intermediate commit is slow and a good way
    # to teach everyone to ignore a red tick.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodnote
          POSTGRES_PASSWORD: foodnote
          POSTGRES_DB: foodnote_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodnote -d foodnote_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # No OPENAI_API_KEY anywhere here: the stub parser is selected at the port,
      # so the provider factory that reads the key never runs.
      - name: Run the smoke net
        run: npm run test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
