name: FoodNote CI
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install & lint
        run: npm ci && npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install & test
        run: npm ci && npm run test

  e2e:
    # Pull requests only: the triggers above also fire on every push to every
    # branch, and a full-stack run per intermediate commit is slow and a good way
    # to teach everyone to ignore a red tick.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Non-blocking while the dashboard is still moving underneath the suite.
    # Removed by the PR that declares the dashboard frozen — from then on a red
    # run means the migration broke something a user can see, which is the whole
    # reason the net exists.
    continue-on-error: true

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodnote
          POSTGRES_PASSWORD: foodnote
          POSTGRES_DB: foodnote_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodnote -d foodnote_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # No OPENAI_API_KEY anywhere here: the stub parser is selected at the port,
      # so the provider factory that reads the key never runs.
      - name: Run the smoke net
        run: npm run test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
